name: build

# mcs51/additions.patch and mcs51/modifications.patch applied to binutils,
# built for each host, then verified against the testbench.
#
# `workflow_call' is here so release.yml can build the release archives with
# this workflow instead of keeping a second copy of the host matrix. The
# archives it uploads ARE the release archives - same names, same layout, same
# `make dist' - so every push that touches the port already proves the
# packaging a release will use, and a host added here is released without
# anybody remembering to add it anywhere else.
#
# The archive names carry the binutils version and an unambiguous host, and the
# directory inside carries the same name: `win64' names neither the OS nor the
# architecture (Windows on arm64 exists), and a shared directory name like
# `toolchain' would let two hosts' archives collide when unpacked into the
# same place, silently overwriting one with the other.

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - 'mcs51/**'
      - 'tb/**'
      - '.github/workflows/build.yml'

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            flags: -Os -flto
            arwrap: yes
            check: native
            distrun: native
            pack: tar
          - name: linux-arm64
            os: ubuntu-24.04-arm
            flags: -Os -flto
            arwrap: yes
            check: native
            distrun: native
            pack: tar
          - name: macos-arm64
            os: macos-14
            flags: -Os -flto
            arwrap: ''
            check: native
            distrun: native
            pack: tar
          - name: windows-x86_64
            os: ubuntu-24.04
            host: x86_64-w64-mingw32
            flags: -Os -flto
            arwrap: yes
            check: wine
            distrun: wine
            pack: zip
          - name: windows-i686
            os: ubuntu-24.04
            host: i686-w64-mingw32
            flags: -Os -flto
            arwrap: yes
            check: wine
            distrun: wine
            pack: zip

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pins live in tb/Makefile and nowhere else: PORT_VERSION names the
      # archives below, and the release workflow reads the same line.
      - name: Read the pins from tb/Makefile
        run: make --no-print-directory -s -C tb release-vars >> "$GITHUB_ENV"

      - name: Install build dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full texinfo zip dejagnu
          if [ "${{ matrix.check }}" = native ]; then sudo apt-get install -y sdcc-ucsim; fi
          if [ -n "${{ matrix.host }}" ]; then sudo apt-get install -y mingw-w64; fi
          if [ "${{ matrix.check }}" = wine ]; then
            if [ "${{ matrix.host }}" = i686-w64-mingw32 ]; then
              sudo dpkg --add-architecture i386
              sudo apt-get update
              sudo apt-get install -y wine64 wine32:i386
            else
              sudo apt-get install -y wine64
            fi
          fi

      - name: Install build dependencies (macos)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
        run: |
          brew install --quiet coreutils gnu-tar p7zip deja-gnu
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build
        run: make -C tb build HOST=${{ matrix.host }} OPTFLAGS="${{ matrix.flags }}" AR_WRAP="${{ matrix.arwrap }}"

      # On Linux these binaries are the ones the archive below ships, so they
      # go through the whole gate rather than a part of it: what is released
      # is what was gated, not a second build of the same commit.
      - name: The gate, on the binaries this job ships
        if: matrix.check == 'native' && runner.os == 'Linux'
        run: make -C tb gate BUILD=$GITHUB_WORKSPACE/work/modern/build

      # macOS has no ucsim package to run the `sim' stage with, so it runs the
      # stages that need none.
      - name: Run the testbench
        if: matrix.check == 'native' && runner.os != 'Linux'
        run: |
          for s in check isa dejagnu; do
            make -C tb "$s" BUILD=$GITHUB_WORKSPACE/work/modern/build || exit 1
          done

      # Runs whatever the testbench reported: it checks that a broken toolchain
      # makes the testbench go red, which is only worth knowing when the testbench
      # has just been run.
      - name: Testbench canary
        if: always() && matrix.check == 'native'
        run: make -C tb check-canary

      - name: Smoke test under wine
        if: matrix.check == 'wine'
        run: |
          set -o pipefail
          wine work/modern/build/gas/as-new.exe --version | head -2
          wine work/modern/build/ld/ld-new.exe --version | head -2

      # Installs, licences, strips, and then runs tb/dist_check.sh over the
      # INSTALLED tree - the only check in the repository that looks at what
      # `install' produced rather than at the build directory. On the two mingw
      # hosts it assembles and links its probe under wine, so the .exe files
      # that go into the archive are the ones proved to work.
      - name: Install and strip
        run: |
          make -C tb dist \
            HOST=${{ matrix.host }} \
            DIST_LABEL=${{ matrix.name }} \
            DIST_RUN=${{ matrix.distrun }} \
            DIST_COMMIT=$GITHUB_SHA

      # zip for Windows, tar.gz elsewhere, and the directory inside the archive
      # is named after the archive so two hosts cannot land on top of each other.
      #
      # The archive is reproducible: every file carries the commit's time, the
      # entries are in name order, and owner and gzip header carry nothing of
      # the machine that made it.
      - name: Package
        run: |
          set -eu
          pkg="i51-binutils-$PORT_VERSION-${{ matrix.name }}"
          mv work/modern/toolchain "work/modern/$pkg"
          epoch=$(git log -1 --format=%ct)
          find "work/modern/$pkg" -exec touch -h -d "@$epoch" {} +
          case "${{ matrix.pack }}" in
            zip) ( cd work/modern && find "$pkg" -print | LC_ALL=C sort \
                     | zip -q -X -9 "$GITHUB_WORKSPACE/$pkg.zip" -@ ) ;;
            *)   tar=tar; command -v gtar > /dev/null && tar=gtar
                 $tar --sort=name --owner=0 --group=0 --numeric-owner \
                      --mtime="@$epoch" -C work/modern -cf - "$pkg" \
                   | gzip -n -9 > "$pkg.tar.gz" ;;
          esac
          ls -l ./"$pkg".*

      - name: Refresh the patches
        if: matrix.name == 'linux-x86_64'
        run: make -C tb refresh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: i51-binutils-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            i51-binutils-*.tar.gz
            i51-binutils-*.zip
            work/refreshed/*.patch
            work/tb/results.md5
            work/tb/projekt/*/www8051.rom
            work/tb/projekt/*/map
            work/tb/*.log
