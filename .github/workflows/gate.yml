name: gate

# Instruction-level gate. Green here is the condition for merging into main.
#
# It runs on every branch, on main, and on every pull request. It used to carry
# `branches-ignore: [main]' and no `pull_request' trigger at all, which meant the
# gate never ran on the branch it gates and never ran on the change being merged
# - only on the pushes to the topic branch beforehand.
#
# The stage list is tb/Makefile's $(GATE) and is kept in the same order. `check'
# is one of them: the merge gate's only contact with the ten projects used to be
# `oracle', which compares against the 2001 image and never hashes a produced ROM
# against the reference base.7z ships. Both run now, and both fail a project that
# does not build.

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  isa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full sdcc-ucsim

      - name: Build the port
        run: make -C tb build

      - name: Instruction gate
        run: make -C tb isa BUILD=$GITHUB_WORKSPACE/work/modern/build

      - name: Disassembler round-trip
        if: always()
        run: make -C tb roundtrip BUILD=$GITHUB_WORKSPACE/work/modern/build

      - name: Literal-branch gate
        if: always()
        run: make -C tb branch BUILD=$GITHUB_WORKSPACE/work/modern/build

      - name: Bit-address boundaries
        if: always()
        run: make -C tb bits BUILD=$GITHUB_WORKSPACE/work/modern/build

      - name: Relocations end to end
        if: always()
        run: make -C tb reloc BUILD=$GITHUB_WORKSPACE/work/modern/build

      # An object whose r_offset points past the end of its section. Five
      # relocations index the contents themselves, so the bounds check at the
      # head of i51_final_link_relocate() is all that stands between such an
      # object and a wild read or write; deleting it left every other stage
      # green. The check only warns, so the diagnostic is what is judged.
      - name: Malformed r_offset
        if: always()
        run: make -C tb guard BUILD=$GITHUB_WORKSPACE/work/modern/build

      - name: Simulator oracle
        if: always()
        run: make -C tb sim BUILD=$GITHUB_WORKSPACE/work/modern/build

      - name: Default-script link
        if: always()
        run: make -C tb defaultlink BUILD=$GITHUB_WORKSPACE/work/modern/build

      - name: Memory-space commons
        if: always()
        run: make -C tb commons BUILD=$GITHUB_WORKSPACE/work/modern/build

      # Every `*(...)' arm of the default script and of base.7z's lib/www51.sc
      # gets an input of its own and has to place it at the recorded address. A
      # dropped arm keeps its section and its symbol and loses only the bytes,
      # which is how `*(reset_network)' hid in www51.sc until base.7z was
      # repacked with the line restored.
      - name: Linker-script arms
        if: always()
        run: make -C tb script BUILD=$GITHUB_WORKSPACE/work/modern/build

      # The disassembler's symbol filter on a linked ELF - the one place it
      # decides anything. Every other objdump call in tb/ passes `-b binary',
      # so i51_symbol_is_valid had never been executed by the gate at all.
      - name: Disassembler symbol filter
        if: always()
        run: make -C tb disasm BUILD=$GITHUB_WORKSPACE/work/modern/build

      # The ten projects against the reference ROMs base.7z ships, hashed after
      # extraction and deleted before anything is built. A project that fails to
      # build is a failure here, and again in oracle below.
      - name: Testbench against the reference ROMs
        if: always()
        run: make -C tb check BUILD=$GITHUB_WORKSPACE/work/modern/build

      - name: Testbench canary
        if: always()
        run: make -C tb check-canary

      # The ten ROMs against projekt/*/www8051.hex, the 2001 output base.7z ships
      # and that nothing in this repository can regenerate. Eight of the ten are
      # compared byte by byte: every differing byte has to fall into one of the
      # recorded 2001 relocation defects and each of the six class counts has to
      # be the recorded one. diag and serial carry a size delta that a byte walk
      # cannot see past, so for those two only the delta is gated; hexoracle.py
      # says which projects it classified.
      - name: 2001 .hex oracle
        if: always()
        run: make -C tb oracle BUILD=$GITHUB_WORKSPACE/work/modern/build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-results
          if-no-files-found: warn
          path: |
            work/tb/results.md5
            work/tb/reference.md5
            work/tb/*.log
            work/tb/projekt/*/www8051.rom
            work/tb/projekt/*/map
